name: Run Deep FAT trace 8-point
on:
  push:
    paths:
      - 'FAT_TRACE_DIAGNOSTIC_TRIGGER.md'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the existing 8-point patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          wf = Path('.github/workflows/deep-fat-trace-8point.yml').read_text(encoding='utf-8')
          start = wf.find('          python - <<\'PY\'')
          if start < 0:
              raise SystemExit('Deep FAT trace python block not found')
          start = wf.find('\n', start) + 1
          end = wf.find('\n          PY', start)
          if end < 0:
              raise SystemExit('Deep FAT trace python block terminator not found')
          block = wf[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/deep_fat_trace_patch.py').write_text(block, encoding='utf-8')
          compile(block, 'deep_fat_trace_patch.py', 'exec')
          print('Extracted 8-point patch:', len(block), 'bytes')
          PY
          python /tmp/deep_fat_trace_patch.py
          python -m py_compile cable_offset_core.py
          git diff --check
          echo '--- TRACE MARKERS ---'
          grep -n 'FAT-TRACE' cable_offset_core.py
          test "$(grep -c '\[FAT-TRACE\]\[01 DISCOVERED\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[02 OWNER\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[03 OFFSET-ENTER\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[04 ORIGINAL-NODE\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[05 FINAL-CORNER\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[06 TARGET\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[07 MOVE\]' cable_offset_core.py)" -ge 1
          test "$(grep -c '\[FAT-TRACE\]\[08 WRITEBACK\]' cable_offset_core.py)" -ge 1

      - name: Commit and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git rm -f FAT_TRACE_DIAGNOSTIC_TRIGGER.md .github/workflows/add-fat-trace-diagnostic.yml
          git commit -m 'debug: restore complete FAT trace 8-point chain'
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
