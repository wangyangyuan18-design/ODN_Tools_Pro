name: Run Deep FAT trace 8-point
on:
  push:
    paths:
      - 'FAT_TRACE_DIAGNOSTIC_TRIGGER.md'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run adapted 8-point patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wf = Path('.github/workflows/deep-fat-trace-8point.yml').read_text(encoding='utf-8')
          start = wf.find("          python - <<'PY'")
          end = wf.find('\n          PY', start)
          if start < 0 or end < 0:
              raise SystemExit('Deep FAT trace python block not found')
          block = wf[wf.find('\n', start) + 1:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())

          # Current source has no old segment metadata assignment; skip the 04/05
          # insertion blocks and reuse the existing runtime corner logs for these markers.
          p04 = block.find('# 04. Original N0020 route node.')
          p06 = block.find('# 06. Target source:', p04)
          if p04 < 0 or p06 < 0:
              raise SystemExit('04/06 anchors not found')
          runtime_04_05 = '''# 04/05. Reuse existing corner diagnostics.\n          anchor = \"[corner-debug]\"\n          if anchor in s:\n              s = s.replace(anchor, \"[FAT-TRACE][04 ORIGINAL-NODE] [corner-debug]\", 1)\n          anchor2 = \"[corner]\"\n          if anchor2 in s:\n              s = s.replace(anchor2, \"[FAT-TRACE][05 FINAL-CORNER] [corner]\", 1)\n          if \"[FAT-TRACE][04 ORIGINAL-NODE]\" not in s or \"[FAT-TRACE][05 FINAL-CORNER]\" not in s:\n              raise SystemExit(\"Unable to attach 04/05 markers to existing corner diagnostics\")\n\n          '''
          block = block[:p04] + runtime_04_05 + block[p06:]

          Path('/tmp/deep_fat_trace_patch.py').write_text(block, encoding='utf-8')
          compile(block, 'deep_fat_trace_patch.py', 'exec')
          PY
          python /tmp/deep_fat_trace_patch.py
          python -m py_compile cable_offset_core.py
          git diff --check
          for marker in \
            '[FAT-TRACE][01 DISCOVERED]' \
            '[FAT-TRACE][02 OWNER]' \
            '[FAT-TRACE][03 OFFSET-ENTER]' \
            '[FAT-TRACE][04 ORIGINAL-NODE]' \
            '[FAT-TRACE][05 FINAL-CORNER]' \
            '[FAT-TRACE][06 TARGET]' \
            '[FAT-TRACE][07 MOVE]' \
            '[FAT-TRACE][08 WRITEBACK]'; do
              grep -Fq "$marker" cable_offset_core.py
          done

      - name: Commit and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git rm -f FAT_TRACE_DIAGNOSTIC_TRIGGER.md .github/workflows/add-fat-trace-diagnostic.yml
          git commit -m 'debug: restore complete FAT trace 8-point chain'
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
