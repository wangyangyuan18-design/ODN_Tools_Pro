name: Final F821 repair
on:
  push:
    paths:
      - 'F821_FINAL_TRIGGER.md'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined trace_design
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('cable_offset_core.py')
          s = p.read_text(encoding='utf-8')
          old = 'if _fat_trace_focus(trace_design, str(feature["Name"]) if feature.fields().indexOf("Name") >= 0 else ""):'
          new = 'if _fat_trace_focus(design, str(feature["Name"]) if feature.fields().indexOf("Name") >= 0 else ""):'
          if old not in s:
              raise SystemExit('expected F821 line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile cable_offset_core.py
          python -m pip install --disable-pip-version-check -q ruff
          ruff check --select F821 --output-format=concise .
      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git rm -f .github/workflows/fix-f821-final.yml F821_FINAL_TRIGGER.md
          git commit -m 'fix: clear remaining F821 in Offset Core'
          git push
