name: Build QGIS Plugin ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/build-qgis-plugin.yml'
      - 'ODN_Tools_Pro.zip'
      - 'ODN_Tools_Pro-QGIS-Plugin.ZIP'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CROSS_MAIN geometry fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cable_offset_core.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _cross_main_corner(node, in_a, in_b, out_a, out_b, prev_slot, next_slot, spacing):
    """E: cross Main Lane first, hold engineering spacing, then turn.

    The middle point is intentionally on the Main Lane route direction, but it
    is offset longitudinally from the Pole, so the cable never lands on the
    physical Pole node.  This gives the required "cross -> hold 0.50 m -> turn"
    behaviour when moving from +N to -M (or vice versa).
    """
    in_dir = _safe_unit(in_a, in_b)
    out_dir = _safe_unit(out_a, out_b)
    magnitude = max(abs(int(prev_slot)), abs(int(next_slot)), 1) * float(spacing)
    edge_in_length = hypot(in_b.x() - in_a.x(), in_b.y() - in_a.y())
    edge_out_length = hypot(out_b.x() - out_a.x(), out_b.y() - out_a.y())
    cross_run = _clamped_run(edge_in_length, 0.65 * magnitude)
    hold_run = _clamped_run(edge_out_length, 0.45 * float(spacing))
    turn_run = _clamped_run(edge_out_length, 0.90 * magnitude)

    incoming = _offset_lane_point(_point_back(node, in_dir, cross_run), in_dir, prev_slot, spacing)
    main_hold = _point_forward(node, out_dir, hold_run)
    target = _offset_lane_point(_point_forward(node, out_dir, turn_run), out_dir, next_slot, spacing)

    _log(
        f"[corner-debug] CROSS_MAIN; spacing={float(spacing):.3f}; "
        f"prev_slot={int(prev_slot)}; next_slot={int(next_slot)}; "
        f"magnitude={float(magnitude):.3f}; cross_run={float(cross_run):.3f}; "
        f"hold_run={float(hold_run):.3f}; turn_run={float(turn_run):.3f}; "
        f"node={_corner_debug_point(node)}; "
        f"incoming={_corner_debug_point(incoming)}; "
        f"main_hold={_corner_debug_point(main_hold)}; "
        f"target={_corner_debug_point(target)}"
    )

    return [incoming, main_hold, target]
'''
          new = '''def _cross_main_corner(node, in_a, in_b, out_a, out_b, prev_slot, next_slot, spacing):
    """E: cross the Main Lane directly when the relative side changes.

    A previous implementation inserted a longitudinal ``main_hold`` point
    (0.45 * spacing = 0.225 m at the default 0.50 m spacing).  That created
    the observed dog-leg: the cable first moved in the outgoing direction,
    then moved farther across the corner, and finally turned back into the
    target lane.  CROSS_MAIN must be a direct transition between the incoming
    lane and the outgoing target lane; it must not introduce an artificial
    0.225 m hold segment.
    """
    in_dir = _safe_unit(in_a, in_b)
    out_dir = _safe_unit(out_a, out_b)
    magnitude = max(abs(int(prev_slot)), abs(int(next_slot)), 1) * float(spacing)
    edge_in_length = hypot(in_b.x() - in_a.x(), in_b.y() - in_a.y())
    edge_out_length = hypot(out_b.x() - out_a.x(), out_b.y() - out_a.y())
    cross_run = _clamped_run(edge_in_length, 0.65 * magnitude)
    turn_run = _clamped_run(edge_out_length, 0.90 * magnitude)

    incoming = _offset_lane_point(_point_back(node, in_dir, cross_run), in_dir, prev_slot, spacing)
    target = _offset_lane_point(_point_forward(node, out_dir, turn_run), out_dir, next_slot, spacing)

    _log(
        f"[corner-debug] CROSS_MAIN; spacing={float(spacing):.3f}; "
        f"prev_slot={int(prev_slot)}; next_slot={int(next_slot)}; "
        f"magnitude={float(magnitude):.3f}; cross_run={float(cross_run):.3f}; "
        f"turn_run={float(turn_run):.3f}; hold_run=REMOVED; "
        f"node={_corner_debug_point(node)}; "
        f"incoming={_corner_debug_point(incoming)}; "
        f"target={_corner_debug_point(target)}"
    )

    # Direct crossover: no artificial Main-Lane hold point between the two
    # physical offset lanes.  The actual Pole remains a topology reference,
    # never a geometry vertex for this non-zero lane transition.
    return [incoming, target]
'''
          if old not in text:
              raise SystemExit('Expected CROSS_MAIN function body was not found; aborting without changes.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('CROSS_MAIN patch applied.')
          PY

      - name: Verify CROSS_MAIN fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hold_run=REMOVED' cable_offset_core.py
          grep -q 'return \[incoming, target\]' cable_offset_core.py
          ! grep -q 'return \[incoming, main_hold, target\]' cable_offset_core.py
          python -m py_compile cable_offset_core.py

      - name: Commit CROSS_MAIN fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          if git diff --cached --quiet; then
            echo 'CROSS_MAIN fix already present.'
          else
            git commit -m 'Fix CROSS_MAIN corner geometry [skip ci]'
            git push
          fi

      - name: Validate QGIS plugin structure
        shell: bash
        run: |
          set -euo pipefail
          test -f metadata.txt
          test -f __init__.py
          grep -q '^name=' metadata.txt
          grep -q '^version=' metadata.txt
          grep -q 'def classFactory' __init__.py

      - name: Validate Offset Core architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f cable_offset_core.py
          test -f cable_offset_layout.py
          test -f cable_offset_layout_v6.py
          test ! -e cable_offset_layout_v2.py
          test ! -e cable_offset_layout_v5.py
          test ! -e cable_offset_layout_v7.py
          test ! -e cable_offset_layout_v8.py
          test ! -e cable_offset_layout_v9.py
          test ! -e cable_offset_layout_v10.py
          test ! -e cable_offset_fat_v2.py
          test ! -e offset_write_patch.py
          grep -q 'cable_offset_core' cable_offset_layout_v6.py
          grep -q 'cable_offset_core' cable_offset_layout_v3.py
          grep -q 'cable_offset_core' cable_offset_layout_v4.py
          if grep -R -nE 'cable_offset_layout_v(2|5|7|8|9|10)|cable_offset_fat_v2|offset_write_patch' --include='*.py' .; then
            echo 'Retired offset implementation reference detected.'
            exit 1
          fi
          if grep -nE 'monkey.?patch|_target_for_fat|_build_segment_points' cable_offset_core.py; then
            echo 'Legacy runtime replacement hook detected in Offset Core.'
            exit 1
          fi

      - name: Prepare plugin package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/ODN_Tools_Pro
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='package/' --exclude='ODN_Tools_Pro.zip' --exclude='ODN_Tools_Pro-QGIS-Plugin.ZIP' ./ package/ODN_Tools_Pro/
          find package/ODN_Tools_Pro -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find package/ODN_Tools_Pro -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q package/ODN_Tools_Pro
          find package/ODN_Tools_Pro -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Build directly installable QGIS plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -r ../ODN_Tools_Pro.zip ODN_Tools_Pro -x '*/__pycache__/*' '*.pyc' '*.pyo'
          cd ..
          unzip -t ODN_Tools_Pro.zip

      - name: Verify ZIP layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          with ZipFile('ODN_Tools_Pro.zip') as zf:
              names = [n for n in zf.namelist() if n and not n.endswith('/')]
              assert names
              assert {PurePosixPath(n).parts[0] for n in names} == {'ODN_Tools_Pro'}
              assert 'ODN_Tools_Pro/metadata.txt' in names
              assert 'ODN_Tools_Pro/__init__.py' in names
              init_text = zf.read('ODN_Tools_Pro/__init__.py').decode('utf-8')
              assert 'install_link_design_odn21' not in init_text
          PY

      - name: Upload directly installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: ODN_Tools_Pro-QGIS-Plugin
          path: ODN_Tools_Pro.zip
          if-no-files-found: error
          retention-days: 30
