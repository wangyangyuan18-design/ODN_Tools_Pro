name: Apply FAT trace patch

on:
  push:
    paths:
      - 'tools/patch_fat_trace.py'
      - '.github/workflows/apply-fat-trace-patch.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch source
        run: |
          python tools/patch_fat_trace.py
          python -m py_compile cable_offset_core.py
          git diff --check
          git status --short

      - name: Commit and push source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          if git diff --cached --quiet; then
            echo 'ERROR: no source changes created'
            exit 1
          fi
          git commit -m 'debug: implement complete FAT trace 8-point chain'
          git push origin HEAD:main
