name: Temporary Lane Compaction Cleanup

on:
  push:
    paths:
      - '.github/workflows/_lane_compact_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch authoritative Offset Core
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          path = Path('cable_offset_core.py')
          text = path.read_text(encoding='utf-8')

          start = text.find('\ndef _plan(designs, dc, edge_layer, spacing):')
          if start < 0:
              raise SystemExit('ERROR: authoritative _plan() not found')
          next_def = text.find('\ndef ', start + 1)
          if next_def < 0:
              next_def = len(text)

          old = text[start + 1:next_def]
          if 'previous_slot' not in old or 'edge_group_slots' not in old:
              raise SystemExit('ERROR: unexpected _plan() baseline; refusing to patch')

          new = r'''def _plan(designs, dc, edge_layer, spacing):
              """Global lane allocation with compact relative lanes and stable side continuity."""
              edge_crs = edge_layer.crs()
              work = _metric_crs(edge_layer, dc)
              pending, routes = _collect_uses(designs, edge_crs, work)
              _validate_pole_exclusivity(designs, edge_crs, work)

              ordered = sorted(
                  routes,
                  key=lambda index: (
                      -float(routes[index].get("priority_score", 0)),
                      -float(routes[index].get("longest_directional_run", 0)),
                      -float(routes[index].get("route_length", 0)),
                      int(index),
                  ),
              )
              rank = {index: order for order, index in enumerate(ordered)}
              occupancy = _occupancy(dc, designs, work)
              spatial_index, geometries = _base._build_existing_index(occupancy, work)

              reserved_cache = {}
              slots = {}
              uses_by_edge = {}
              for use in pending:
                  uses_by_edge.setdefault(use.edge_key, []).append(use)
              for uses in uses_by_edge.values():
                  uses.sort(key=lambda use: (rank.get(use.design_index, 999999), use.segment_index, use.edge_index))

              def reserved(edge):
                  if edge not in reserved_cache:
                      a, b = _base._edge_points(edge)
                      a = _tp(a, edge_crs, work)
                      b = _tp(b, edge_crs, work)
                      reserved_cache[edge] = _base._existing_slot_occupancy(
                          QgsGeometry.fromPolylineXY([a, b]), spacing, spatial_index, geometries
                      )
                  return set(reserved_cache[edge])

              def edge_order_key(edge):
                  return min((rank.get(use.design_index, 999999), use.segment_index, use.edge_index) for use in uses_by_edge[edge])

              slot_changes = 0
              continuity_preserved = 0
              compressed_edges = 0

              for edge in sorted(uses_by_edge, key=edge_order_key):
                  uses = uses_by_edge[edge]
                  reserved_slots = reserved(edge)
                  used = set(reserved_slots)
                  assigned = {}

                  # Main lane remains a unique physical center lane. Prefer a route that
                  # already owns lane 0 on its preceding edge; otherwise use stable route order.
                  primary = None
                  if 0 not in used:
                      for use in uses:
                          if use.edge_index > 0 and slots.get((use.design_index, use.segment_index, use.edge_index - 1)) == 0:
                              primary = use
                              break
                      if primary is None and uses:
                          primary = uses[0]
                  if primary is not None:
                      key = (primary.design_index, primary.segment_index, primary.edge_index)
                      assigned[key] = 0
                      used.add(0)

                  non_main = [use for use in uses if (use.design_index, use.segment_index, use.edge_index) not in assigned]

                  # Reconstruct each cable's physical side from its previous lane whenever
                  # possible. This prevents a cable from jumping from left to right merely
                  # because the compacted group was renumbered.
                  side_groups = {1: [], -1: []}
                  for use in non_main:
                      previous = slots.get((use.design_index, use.segment_index, use.edge_index - 1)) if use.edge_index > 0 else None
                      if previous is not None and previous != 0:
                          side = 1 if previous > 0 else -1
                      else:
                          side = 1 if use.side_hint >= 0 else -1
                      side_groups[side].append((use, previous))

                  # Existing members retain relative order by old magnitude. New members
                  # are deterministic by route order. Each side is renumbered from the
                  # center outward, eliminating holes such as 0,2,3 -> 0,1,2.
                  for side in (1, -1):
                      members = side_groups[side]
                      members.sort(
                          key=lambda item: (
                              0 if item[1] is not None and item[1] != 0 else 1,
                              abs(int(item[1])) if item[1] not in (None, 0) else 999999,
                              rank.get(item[0].design_index, 999999),
                              item[0].segment_index,
                              item[0].edge_index,
                          )
                      )
                      magnitude = 1
                      for use, previous in members:
                          while side * magnitude in used or side * magnitude in reserved_slots:
                              magnitude += 1
                          key = (use.design_index, use.segment_index, use.edge_index)
                          chosen = side * magnitude
                          assigned[key] = chosen
                          used.add(chosen)
                          if previous is not None and previous == chosen:
                              continuity_preserved += 1
                          magnitude += 1

                  # Defensive fallback: every pending use must receive exactly one lane.
                  if len(assigned) != len(uses):
                      for use in uses:
                          key = (use.design_index, use.segment_index, use.edge_index)
                          if key in assigned:
                              continue
                          sign = 1 if use.side_hint >= 0 else -1
                          magnitude = 1
                          while sign * magnitude in used or sign * magnitude in reserved_slots:
                              magnitude += 1
                          assigned[key] = sign * magnitude
                          used.add(sign * magnitude)

                  previous_abs = sorted(abs(int(v)) for v in assigned.values() if int(v) != 0)
                  if previous_abs != list(range(1, len(previous_abs) + 1)):
                      compressed_edges += 1

                  for use in uses:
                      key = (use.design_index, use.segment_index, use.edge_index)
                      chosen = int(assigned[key])
                      slots[key] = chosen
                      use.slot = chosen
                      if use.edge_index > 0:
                          previous = slots.get((use.design_index, use.segment_index, use.edge_index - 1))
                          if previous is not None and previous != chosen:
                              slot_changes += 1

                  planned_zero = sum(
                      1 for use in uses if slots.get((use.design_index, use.segment_index, use.edge_index)) == 0
                  )
                  if 0 not in reserved_slots and uses and planned_zero != 1:
                      raise RuntimeError(
                          f"Offset Core: Pole Edge main-lane invariant violated for edge {edge}: planned_zero={planned_zero}"
                      )
                  if 0 in reserved_slots and planned_zero:
                      raise RuntimeError(
                          f"Offset Core: Pole Edge has duplicate main-lane ownership for edge {edge}"
                      )

              _log(
                  f"[route-plan] links={len(ordered)}; main=EXACTLY_ONE_SLOT0_PER_EDGE; "
                  f"continuity=RELATIVE_POSITION; compact=ON; side-stability=ON; "
                  f"group-outside=ON; pole-exclusivity=ON; global-order=ON; "
                  f"slot-changes={slot_changes}; preserved={continuity_preserved}; compressed={compressed_edges}"
              )
              return edge_crs, work, ordered, routes, slots

          new = textwrap.dedent(new) if False else new
          # Remove the heredoc indentation without changing code indentation inside the function.
          lines = new.splitlines()
          common = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          new = '\n'.join(line[common:] for line in lines) + '\n'

          patched = text[:start + 1] + new + text[next_def + 1:]
          ast.parse(patched, filename=str(path))
          path.write_text(patched, encoding='utf-8')
          print('Patched cable_offset_core.py successfully')
          PY

      - name: Validate and commit
        run: |
          python -m py_compile cable_offset_core.py
          grep -n "compact=ON; side-stability=ON" cable_offset_core.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cable_offset_core.py
          git rm .github/workflows/_lane_compact_cleanup.yml
          git commit -m "fix: compact relative cable lanes and preserve side continuity"
          git push
