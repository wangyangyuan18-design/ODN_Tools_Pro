name: Temp F821 Check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and F821
        run: |
          sed -i '912s/\btrace_design\b/design/g;973s/\bdesign\b/trace_design/g;974s/\bdesign\b/trace_design/g' cable_offset_core.py
          python -m py_compile cable_offset_core.py
          python -m pip install --disable-pip-version-check -q ruff
          ruff check --select F821 --output-format=concise .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair Offset FAT trace NameError'
            git push
          fi
