name: Deep FAT trace 8-point

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Inject FAT trace and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cable_offset_core.py')
          s = p.read_text(encoding='utf-8')
          # Keep the existing diagnostic patch intact; only make the workflow's
          # commit/push stage reliable. The source is compiled after patching.
          required = [
              '[FAT-TRACE][01 DISCOVERED]',
              '[FAT-TRACE][02 OWNER]',
              '[FAT-TRACE][03 OFFSET-ENTER]',
              '[FAT-TRACE][04 ORIGINAL-NODE]',
              '[FAT-TRACE][TARGET]',
              '[FAT-TRACE][DECISION]',
              '[FAT-TRACE][08 WRITEBACK]',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing FAT trace markers: ' + ', '.join(missing))
          compile(s, str(p), 'exec')
          print('FAT trace source syntax OK')
          PY
          git diff --check
          echo '--- STATUS BEFORE COMMIT ---'
          git status --short
          echo '--- HEAD ---'
          git rev-parse HEAD

      - name: Commit and push
        shell: bash
        run: |
          git add cable_offset_core.py
          if git diff --cached --quiet; then
            echo 'ERROR: no cable_offset_core.py changes are staged.'
            exit 1
          fi
          git commit -m "debug: make FAT trace 8-point runtime chain robust"
          git push origin HEAD:main

      - name: Verify pushed commit
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          echo "LOCAL  $local_sha"
          echo "REMOTE $remote_sha"
          test "$local_sha" = "$remote_sha"
