name: Run FAT trace patch
on:
  push:
    paths:
      - '.github/workflows/run_fat_trace_patch.trigger'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch diagnostics
        run: python tools/trace_fat_issue.py
      - name: Syntax check
        run: python -m py_compile cable_offset_core.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git diff --cached --quiet || git commit -m 'debug: trace DAR436 H1A1 L3 L4 FAT landing'
          git push
