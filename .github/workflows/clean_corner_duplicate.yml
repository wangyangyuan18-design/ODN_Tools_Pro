name: Clean corner geometry duplicate

on:
  push:
    paths:
      - '.github/workflows/clean_corner_duplicate.trigger'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/clean_corner_duplicate.py
      - run: python -m py_compile cable_offset_core.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git commit -m 'chore: remove duplicate unified corner helpers [skip ci]'
          git push
