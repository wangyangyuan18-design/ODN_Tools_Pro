name: Fix MAIN_REACH corner geometry

on:
  push:
    paths:
      - '.github/workflows/fix_main_reach.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MAIN_REACH geometry
        run: python tools/fix_main_reach.py
      - name: Validate syntax
        run: python -m py_compile cable_offset_core.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git commit -m 'fix: remove MAIN_REACH backtracking geometry [skip ci]'
          git push
