name: Fix corner geometry root cause

on:
  push:
    paths:
      - '.github/workflows/fix_corner_root.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified corner geometry
        run: python tools/fix_corner_geometry_root.py
      - name: Validate syntax
        run: python -m py_compile cable_offset_core.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cable_offset_core.py
          git commit -m 'fix: unify corner geometry using true lane intersections [skip ci]'
          git push
